name: Workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt flake8 nose

      - name: Initialize containers
        run: |
          echo "Python runtime initialized"
          python --version

      - name: Lint with flake8
        run: flake8 server.py emotion_detection test_emotion_detection.py --max-line-length=100

      - name: Test with nose
        run: nosetests -v

      - name: Post Setup Node.js
        if: always()
        run: echo "No Node.js runtime is required for this Python application."

      - name: Post Checkout
        if: always()
        run: echo "Checkout cleanup complete."
