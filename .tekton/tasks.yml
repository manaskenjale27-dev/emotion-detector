apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  description: Remove prior workspace contents before cloning source.
  workspaces:
    - name: source
  steps:
    - name: cleanup
      image: alpine:3.20
      script: |
        #!/bin/sh
        set -eu
        find "$(workspaces.source.path)" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
spec:
  description: Clone the public Emotion Detector repository into the shared workspace.
  params:
    - name: url
      type: string
      default: https://github.com/manaskenjale27-dev/emotion-detector.git
    - name: revision
      type: string
      default: main
  workspaces:
    - name: source
  steps:
    - name: clone
      image: alpine/git:2.45.2
      script: |
        #!/bin/sh
        set -eu
        git clone --depth 1 --branch "$(params.revision)" "$(params.url)" "$(workspaces.source.path)"

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: test
spec:
  description: Run flake8 lint and Python unit tests.
  workspaces:
    - name: source
  steps:
    - name: flake8
      image: python:3.11-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        python -m pip install --disable-pip-version-check -r requirements.txt flake8
        flake8 server.py emotion_detection test_emotion_detection.py --max-line-length=100
    - name: nose
      image: python:3.11-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        python -m pip install --disable-pip-version-check -r requirements.txt
        python -m unittest discover -s . -p 'test_*.py' -v
