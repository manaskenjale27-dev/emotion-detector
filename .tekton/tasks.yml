apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  description: Remove the previous application build artifacts from the workspace.
  workspaces:
    - name: source
  steps:
    - name: cleanup
      image: alpine:3.20
      script: |
        #!/bin/sh
        set -eu
        find "$(workspaces.source.path)" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: test
spec:
  description: Lint the Python application and run its unit tests.
  workspaces:
    - name: source
  steps:
    - name: flake8
      image: python:3.11-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        pip install --disable-pip-version-check -r requirements.txt flake8
        flake8 server.py emotion_detection test_emotion_detection.py --max-line-length=100
    - name: nose
      image: python:3.11-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        pip install --disable-pip-version-check -r requirements.txt nose
        nosetests -v
